<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SOLAR AI AGENT - asisten AI solution architect dengan karakter 3D (Robo, Mochi, Cocoa Kelapa, Kelinci): ArchiMate, sequence diagram dan Technical Specification Document." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fcfcfb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SOLAR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SOLAR AI AGENT</title>
    <script>
      try {
        var t = localStorage.getItem('solar.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script>
      // interface language before the first paint (same rules as detectLang in src/lib/i18n.ts)
      (function () {
        var l = null;
        try {
          l = JSON.parse(localStorage.getItem('solar.lang') || 'null');
        } catch (e) {}
        if (l !== 'id' && l !== 'en') {
          l = 'id';
          var tags = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
          for (var i = 0; i < tags.length; i++) {
            var p = String(tags[i]).toLowerCase().split(/[-_]/)[0];
            if (p === 'id' || p === 'ms') break;
            if (p === 'en') {
              l = 'en';
              break;
            }
          }
        }
        document.documentElement.lang = l;
        if (l === 'en') {
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.setAttribute('href', '/manifest.en.webmanifest');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
