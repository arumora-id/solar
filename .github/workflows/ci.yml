name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # the Electron binary is only needed to build the desktop installer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate reviewed VPS deployment shell scripts
        run: bash -n scripts/deploy-conversation-proposals-vps.sh scripts/rollback-conversation-proposals-vps.sh scripts/deploy-v1.0.10-vps.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify distributable self-hosted server bundle
        run: node scripts/pack-server.mjs
      # Chromium smoke tests cover viewport geometry & interactive controls absent from TypeScript/unit tests.
      - name: Install Chromium for responsive UI smoke tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Responsive UI smoke tests
        run: node scripts/ui-layout-smoke.mjs
      - name: Role governance, content workflow and image permissions QA (Chromium)
        run: node scripts/content-governance-qa.mjs
      - name: Diagram visual QA (Chromium SVG) and editable export fixtures
        run: node --import tsx scripts/diagram-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-diagram-visual-qa
          path: ${{ runner.temp }}/solar-diagram-qa/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-governance-qa-screenshots
          path: ${{ runner.temp }}/solar-governance-screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-responsive-ui-screenshots
          path: ${{ runner.temp }}/solar-ui-screenshots/*.png
          if-no-files-found: ignore

  windows-installer-check:
    # A green Linux build does not prove Electron packaging works on Windows.
    # Build the actual installer, without publishing a release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: solar-windows-pr-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
