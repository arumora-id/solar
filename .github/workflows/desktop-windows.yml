name: Desktop installer (Windows)

# Builds the Windows installer and the self-host bundle (server + web app / PWA).
# Publishing a GitHub Release: push a tag "v<version>" (the version in package.json), or "Run workflow" with
# "release" ticked - the tag is then created on the commit that was built.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Terbitkan GitHub Release v<versi di package.json> dari commit ini'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check the version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not a release version"; exit 1
          fi
          for f in packages/shared/package.json apps/server/package.json apps/web/package.json apps/desktop/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then echo "::error file=$f::version $v differs from package.json ($version)"; exit 1; fi
          done
          if ! grep -q "APP_VERSION = '$version'" apps/server/src/config.ts; then
            echo "::error file=apps/server/src/config.ts::APP_VERSION is not '$version'"; exit 1
          fi
          publish=false
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then echo "::error::tag $REF_NAME does not match package.json (v$version)"; exit 1; fi
            publish=true
          elif [ "$RELEASE" = true ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::tag v$version already exists - raise the version in package.json (and the workspaces) first"; exit 1
            fi
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: SOLAR-AI-AGENT-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  server-bundle:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SOLAR-AI-AGENT-server
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: [version, installer, server-bundle]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SOLAR AI AGENT v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/*.exe
            assets/*.zip
          body: |
            ## Unduhan

            - **SOLAR-AI-AGENT-Setup-${{ needs.version.outputs.version }}.exe** - installer Windows (64-bit). Installer belum
              ditandatangani: bila Windows SmartScreen muncul, pilih *More info → Run anyway*. Data dan `.env` disimpan di
              `%APPDATA%\SOLAR`, sehingga memperbarui tidak menghapusnya.
            - **SOLAR-AI-AGENT-server-${{ needs.version.outputs.version }}.zip** - server + web app untuk dijalankan sendiri
              (Node.js 22, tanpa `npm install`): `npm start`, lalu buka http://localhost:8790. Petunjuk lengkap di README.md
              dalam zip.

            ## Web app (PWA)

            Web UI SOLAR bisa dipasang sebagai aplikasi dari server SOLAR mana pun: tombol **Pasang aplikasi** di bilah
            atas, *Pengaturan → Sistem → Aplikasi*, atau menu Chrome/Edge → *Instal SOLAR AI AGENT* (iPhone/iPad: Bagikan →
            *Tambahkan ke Layar Utama*). Pemasangan butuh HTTPS, atau localhost di komputer yang menjalankan server -
            termasuk aplikasi desktop: buka http://127.0.0.1:8790 di Chrome/Edge selagi SOLAR AI AGENT berjalan.
